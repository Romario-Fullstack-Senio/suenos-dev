# ============================================================
# Docker Compose — Producción / Preproducción (suenos-dev)
# Ubicación en servidor: ~/deploy/suenos-dev/docker-compose.yml
#   (preprod: ~/deploy/suenos-dev-preprod/docker-compose.yml — mismo
#   archivo, .env distinto — ver infra/.env.preprod.example)
# Servidor NUNCA compila, solo pull + up
#
# Sin `container_name` a propósito: hardcodearlo pisa el prefijo de
# proyecto de Compose y hace que dos stacks (prod + preprod) en el mismo
# host choquen por nombre de contenedor. Sin él, Compose nombra cada
# contenedor como <proyecto>-<servicio>-1, ya namespaced — para
# preprod, levantar con `docker compose -p suenos-preprod ...`
# (ver .github/workflows/deploy-preprod.yml).
# ============================================================
services:
  # ──────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Solo accesible por 127.0.0.1 (Caddy / scripts de backup del mismo host)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - suenos-internal

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 320m
    cpus: 0.5
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suenos-internal

  # ──────────────────────────────────────────────
  # MinIO (object storage para imágenes de portada / videos)
  # ──────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suenos-internal

  # ──────────────────────────────────────────────
  # API (NestJS)
  # ──────────────────────────────────────────────
  api:
    # GHCR exige el nombre del repo en minúsculas — docker/metadata-action ya
    # lo publica así (build-and-push.yml), pero acá había quedado con el
    # casing real del repo ("Romario-Fullstack-Senio"), y Docker rechaza
    # cualquier referencia de imagen con mayúsculas ("invalid reference
    # format"): todo `docker compose pull` con este archivo fallaba siempre,
    # tanto en preprod como en producción.
    image: ghcr.io/romario-fullstack-senio/suenos-dev-api:${API_TAG:-latest}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Habilita Swagger (/docs) en preprod si hace falta — en prod queda
      # apagado salvo que se ponga esta variable explícitamente (ver main.ts).
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # Database — estos nombres tienen que coincidir con los que lee
      # app.module.ts (config.get('DATABASE_HOST', ...)) — antes decía
      # DB_HOST/DB_USER/DB_PASSWORD acá, que la API nunca leyó: se hubiera
      # ido a los defaults (localhost/postgres/admin) en vez de conectar
      # al Postgres real del contenedor.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # Redis — usado por BullModule (cola de emails) y opcionalmente cache
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT — JWT_EXPIRES_IN (no JWT_EXPIRATION, que el código nunca lee)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # MinIO — MINIO_PUBLIC_URL es el host que debe poder alcanzar el
      # NAVEGADOR (portadas de curso), distinto de MINIO_ENDPOINT (nombre
      # del servicio en la red interna de Docker). Sin esto, las URLs de
      # imagen que devuelve la API apuntan a "minio:9000", inalcanzable
      # fuera de la red de contenedores.
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-suenos-dev}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      # OAuth (opcional — la estrategia no arranca si faltan)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      # App URLs — WEB_URL es el origin que main.ts usa para CORS
      # (app.enableCors({ origin: [process.env.WEB_URL, ...] })). Antes no
      # se seteaba acá, así que CORS caía a "http://localhost:3000" y
      # bloqueaba al propio frontend de producción.
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      WEB_URL: ${APP_URL}
      # Sentry (opcional)
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - suenos-internal

  # ──────────────────────────────────────────────
  # Web (Next.js)
  # ──────────────────────────────────────────────
  web:
    image: ghcr.io/romario-fullstack-senio/suenos-dev-web:${WEB_TAG:-latest}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${API_URL}/api
      NEXT_PUBLIC_SITE_URL: ${APP_URL}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      # JWT_SECRET (NO NEXT_PUBLIC_): middleware.ts lo necesita server-side
      # para verificar el sessionToken y proteger rutas. Sin esto, cae al
      # default 'dev-secret', que nunca matchea el JWT_SECRET real de la
      # API — todo usuario logueado quedaría en loop de redirect a /login.
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - suenos-internal

# ──────────────────────────────────────────────
# Volumes persistentes (Compose los namespacea con el nombre de proyecto
# automáticamente — prod y preprod no chocan aunque no se rename acá)
# ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ──────────────────────────────────────────────
# Network interno (solo containers de este stack — namespaceada por proyecto)
# ──────────────────────────────────────────────
networks:
  suenos-internal:
    driver: bridge
    internal: false  # Permite salida a internet (npm, stripe, etc.)
