# ============================================================
# CI: Build & Push Docker images to GHCR
# Only builds images when relevant paths change
# Pattern: "build once, deploy anywhere"
# ============================================================
name: Build & Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # Detect which paths changed
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'shared-kernel/**'
            web:
              - 'apps/web/**'
            shared:
              - 'shared-kernel/**'

  # ──────────────────────────────────────────────
  # Tests + lint — antes NO existía ningún gate acá: un build roto (o que
  # rompiera los 103 tests del backend) llegaba a producción sin que nada
  # lo frenara, porque build-api/build-web no dependían de esto.
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared-kernel
        run: npm run build:shared

      - name: Lint (todos los workspaces)
        run: npm run lint

      - name: Test (apps/api)
        run: npm test --workspace=apps/api

  # ──────────────────────────────────────────────
  # Build API image
  # ──────────────────────────────────────────────
  build-api:
    needs: [changes, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requerido para `cache-to: type=gha` — el driver `docker` por defecto
      # no soporta exportar caché (error: "Cache export is not supported for
      # the docker driver"), solo el driver `docker-container` que activa este step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Build Web image
  # ──────────────────────────────────────────────
  build-web:
    needs: [changes, test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # Las NEXT_PUBLIC_* se hornean en el bundle al compilar (ver
      # apps/web/Dockerfile), así que la imagen web SÍ depende del entorno:
      # main → producción, cualquier otra rama (develop) → preprod. Los
      # valores salen de variables del repo (Settings → Secrets and variables
      # → Actions → Variables) con estos defaults si no están definidas:
      #   - prod:    dominios reales de README-DEPLOY.md.
      #   - preprod: todavía no tiene dominio ni Caddy — se usa por túnel SSH
      #     (tunnel-preprod.bat), así que la URL pública es el localhost del
      #     lado de quien navega: 3100 web / 3101 api (infra/.env.preprod.example).
      # La STRIPE_PUBLISHABLE_KEY (pk_..., pública por diseño de Stripe) no
      # tiene default: sin la variable, Stripe Elements queda deshabilitado.
      #
      # OJO al pasar a producción: ambas ramas publican el tag `latest` de la
      # imagen web, y preprod hoy despliega `latest`. Cuando main empiece a
      # compilar, hay que separar los tags por entorno (p. ej. `preprod-latest`)
      # y ajustar deploy-preprod.yml, o preprod terminaría corriendo la imagen
      # compilada con las URLs de producción.
      - name: Resolve web build args
        id: webargs
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "api_url=${{ vars.PROD_PUBLIC_API_URL || 'https://api.suenos-dev.dev/api' }}" >> "$GITHUB_OUTPUT"
            echo "site_url=${{ vars.PROD_SITE_URL || 'https://suenos-dev.dev' }}" >> "$GITHUB_OUTPUT"
            echo "stripe_pk=${{ vars.PROD_STRIPE_PUBLISHABLE_KEY }}" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=${{ vars.PREPROD_PUBLIC_API_URL || 'http://localhost:3101/api' }}" >> "$GITHUB_OUTPUT"
            echo "site_url=${{ vars.PREPROD_SITE_URL || 'http://localhost:3100' }}" >> "$GITHUB_OUTPUT"
            echo "stripe_pk=${{ vars.PREPROD_STRIPE_PUBLISHABLE_KEY }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.webargs.outputs.api_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.webargs.outputs.site_url }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ steps.webargs.outputs.stripe_pk }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy is triggered by deploy.yml / deploy-preprod.yml themselves via
  # `workflow_run` on this workflow's completion (see their `on:` blocks) —
  # there used to be a `trigger-deploy` job here firing a `repository_dispatch`
  # event, but nothing in this repo ever listened for it (dead since
  # workflow_run was adopted), and GITHUB_TOKEN can't fire repository_dispatch
  # without extra permissions anyway ("Resource not accessible by integration").
  # Removed rather than fixed: workflow_run already does this correctly.
