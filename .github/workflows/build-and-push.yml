# ============================================================
# CI: Build & Push Docker images to GHCR
# Only builds images when relevant paths change
# Pattern: "build once, deploy anywhere"
# ============================================================
name: Build & Push

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # Detect which paths changed
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'shared-kernel/**'
            web:
              - 'apps/web/**'
            shared:
              - 'shared-kernel/**'

  # ──────────────────────────────────────────────
  # Tests + lint — antes NO existía ningún gate acá: un build roto (o que
  # rompiera los 103 tests del backend) llegaba a producción sin que nada
  # lo frenara, porque build-api/build-web no dependían de esto.
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared-kernel
        run: npm run build:shared

      - name: Lint (todos los workspaces)
        run: npm run lint

      - name: Test (apps/api)
        run: npm test --workspace=apps/api

  # ──────────────────────────────────────────────
  # Build API image
  # ──────────────────────────────────────────────
  build-api:
    needs: [changes, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requerido para `cache-to: type=gha` — el driver `docker` por defecto
      # no soporta exportar caché (error: "Cache export is not supported for
      # the docker driver"), solo el driver `docker-container` que activa este step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Build Web image
  # ──────────────────────────────────────────────
  build-web:
    needs: [changes, test]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Trigger deploy after successful build
  # ──────────────────────────────────────────────
  trigger-deploy:
    needs: [build-api, build-web]
    if: always() && (needs.build-api.result == 'success' || needs.build-web.result == 'success' || (needs.build-api.result == 'skipped' && needs.build-web.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.substring(0, 7);
            console.log(`Build completed. Commit SHA: ${sha}`);
            console.log(`API built: ${'${{ needs.build-api.result }}'}`);
            console.log(`Web built: ${'${{ needs.build-web.result }}'}`);
            
            // The deploy workflow will be triggered by repository_dispatch
            // or you can trigger it manually from the Actions tab
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy',
              client_payload: {
                sha: context.sha,
                short_sha: sha,
              },
            });
            console.log('Deploy workflow triggered.');
